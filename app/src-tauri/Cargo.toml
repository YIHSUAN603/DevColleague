[package]
name = "devcolleague"
version = "0.1.0"
description = "DevColleague 桌面 AI 助理"
edition = "2021"

[lib]
name = "devcolleague_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.2"
